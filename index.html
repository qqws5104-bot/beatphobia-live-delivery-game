<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박스 포장 프로토타입</title>
<style>
:root{
  --bg:#fffaf0;
  --ink:#1f1a14;
  --muted:#8a7660;
  --line:#e3dccf;
  --chip:#f2ebe0;
  --kraft:#e8d0a8;
  --kraft-line:#a58e6b;
  --orange:#e8702a;
  --orange-soft:#f6c9a8;
  --good:#2f9e5a;
  --bad:#d6453d;
  /* 안내 키: 게임 화면과 겹치지 않는 차가운 어두운 톤 */
  --guide-bg:#2b3440;
  --guide-key:#3d4856;
  --guide-text:#c9d2dd;
  --guide-on:#7bbcf2;
  --font:"Oswald","Bebas Neue","Arial Narrow","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:800;display:flex;justify-content:center;padding:18px 12px 28px;user-select:none}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.title{font-size:24px}
.title small{font-size:14px;color:var(--muted);margin-left:8px;font-weight:700}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:var(--chip);border-radius:16px;padding:5px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.giveup{font:inherit;font-size:15px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:5px 14px;color:var(--ink);cursor:pointer}
.giveup:focus-visible,.next:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.stage{position:relative;width:260px;height:260px;margin-top:4px}
.stage>div{position:absolute}
.box{left:70px;top:70px;width:120px;height:120px;border-radius:4px;background:linear-gradient(#4a3524,#2f2216);box-shadow:inset 0 0 0 1px #00000040}
.flap{background:var(--kraft);border:2px solid var(--kraft-line);border-radius:4px;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.f-top{left:70px;top:0;width:120px;height:56px}
.f-bottom{left:70px;top:204px;width:120px;height:56px}
.f-left{left:0;top:70px;width:56px;height:120px}
.f-right{left:204px;top:70px;width:56px;height:120px}
.tape{left:64px;top:118px;width:132px;height:24px;background:#d8b95e;border-top:2px solid #b9983f;border-bottom:2px solid #b9983f;opacity:0;transform:scaleX(.2);transition:opacity .2s,transform .3s .35s}
.shadow{left:40px;top:248px;width:180px;height:10px;background:radial-gradient(#0003,#0000 70%)}
.closed .f-top{transform:translateY(72px)}
.closed .f-bottom{transform:translateY(-72px)}
.closed .f-left{transform:translateX(72px)}
.closed .f-right{transform:translateX(-72px)}
.closed .tape{opacity:1;transform:scaleX(1)}
.tap-top .f-top{transform:translateY(9px)}
.tap-bottom .f-bottom{transform:translateY(-9px)}
.tap-left .f-left{transform:translateX(9px)}
.tap-right .f-right{transform:translateX(-9px)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.stage.shake{animation:shake .25s}

.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.k{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:0 6px}
.k.wide{min-width:78px;font-size:13px;letter-spacing:.04em}
.k.done{background:#efe7d8;color:#b5a78f}
.k.cur{border-color:var(--orange);box-shadow:0 3px 0 var(--orange-soft)}

.status{min-height:26px;font-size:17px;text-align:center;color:var(--muted)}
.status.bad{color:var(--bad)} .status.good{color:var(--good)}
.next{font:inherit;font-size:16px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:6px 18px;cursor:pointer;display:none}
.next.show{display:inline-block}

/* 사용 키 안내 */
.guide{background:var(--guide-bg);border-radius:10px;padding:8px 14px 9px;display:flex;flex-direction:column;align-items:center;gap:4px}
.guide .cap{font-size:11px;color:#8d98a6;font-weight:700}
.guide .row{display:flex;gap:3px}
.guide .g{width:30px;height:30px;border-radius:6px;background:var(--guide-key);color:var(--guide-text);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;transition:background .08s}
.guide .g.wide{width:auto;padding:0 14px;font-size:11px}
.guide .g.on{background:var(--guide-on);color:#14202c}

.desc{margin:0;max-width:440px;text-align:center;font-size:14px;line-height:1.55;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.flap,.tape{transition:none}.stage.shake{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="title">박스 포장<small>난이도 보통</small></div>
    <div class="chips">
      <span class="chip" id="time">0.0초</span>
      <span class="chip" id="miss">실수 0</span>
      <button class="giveup" id="giveup" type="button">포기</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-hidden="true">
    <div class="box"></div>
    <div class="flap f-top"></div>
    <div class="flap f-left"></div>
    <div class="flap f-right"></div>
    <div class="flap f-bottom"></div>
    <div class="tape"></div>
    <div class="shadow"></div>
  </section>

  <div class="seq" id="seq" aria-label="눌러야 할 순서"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="next" id="next" type="button">다음 상자</button>

  <div class="guide" aria-label="사용하는 키">
    <span class="cap">사용 키</span>
    <div class="row"><span class="g" data-code="ArrowUp">↑</span></div>
    <div class="row">
      <span class="g" data-code="ArrowLeft">←</span>
      <span class="g" data-code="ArrowDown">↓</span>
      <span class="g" data-code="ArrowRight">→</span>
    </div>
    <div class="row"><span class="g wide" data-code="Space">SPACE · 테이프</span></div>
  </div>

  <p class="desc">화면에 뜬 순서대로 방향키를 누르고, 마지막은 스페이스바로 테이프를 붙이세요. 한 번 틀리면 처음부터 다시 해야 해요.</p>
</main>

<script>
(()=>{
"use strict";
const CFG={ARROWS:6};  // 방향키 개수(마지막 스페이스 제외)
const ARROW={ArrowLeft:"←",ArrowRight:"→",ArrowUp:"↑",ArrowDown:"↓"};
const SIDE={ArrowUp:"top",ArrowDown:"bottom",ArrowLeft:"left",ArrowRight:"right"};
const $=id=>document.getElementById(id);
let seq,pos,misses,started,t0,elapsed,done,doneAt,tapTimer;

function newPackage(msg){
  const codes=Object.keys(ARROW);
  seq=Array.from({length:CFG.ARROWS},()=>codes[Math.floor(Math.random()*codes.length)]);
  seq.push("Space");
  pos=0;misses=0;started=false;elapsed=0;done=false;
  $("stage").classList.remove("closed");
  $("next").classList.remove("show");
  setStatus(msg||"","");
  renderSeq();renderChips();
}
function setStatus(t,c){const s=$("status");s.textContent=t;s.className="status "+(c||"");}
function renderSeq(){
  $("seq").innerHTML=seq.map((c,i)=>{
    const cls="k"+(c==="Space"?" wide":"")+(i<pos?" done":"")+(i===pos&&!done?" cur":"");
    return `<span class="${cls}">${c==="Space"?"SPACE":ARROW[c]}</span>`;
  }).join("");
}
function renderChips(){
  $("time").textContent=elapsed.toFixed(1)+"초";
  $("miss").textContent="실수 "+misses;
}
function tap(code){
  const st=$("stage"),s=SIDE[code];
  if(!s)return;
  st.classList.add("tap-"+s);
  clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>st.className="stage"+(done?" closed":""),110);
}
function wrong(){
  misses++;pos=0;
  const st=$("stage");st.classList.remove("shake");void st.offsetWidth;st.classList.add("shake");
  setStatus("틀렸어요. 처음부터 다시 눌러주세요","bad");
  renderSeq();renderChips();
}
function complete(){
  done=true;doneAt=performance.now();
  $("stage").classList.add("closed");
  setStatus(`포장 완료! ${elapsed.toFixed(1)}초 · 실수 ${misses}`,"good");
  $("next").classList.add("show");
  renderSeq();renderChips();
}
function press(code){
  if(done){ if(code==="Space"&&performance.now()-doneAt>600) newPackage(); return; }
  if(!started){started=true;t0=performance.now();}
  if(code===seq[pos]){
    pos++;
    if(code!=="Space")tap(code);
    setStatus("","");
    if(pos===seq.length)complete();else renderSeq();
  }else wrong();
}

addEventListener("keydown",e=>{
  const known=e.code==="Space"||ARROW[e.code];
  if(!known)return;
  const g=document.querySelector(`.guide .g[data-code="${e.code}"]`);
  if(g)g.classList.add("on");
  if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&e.code==="Space"){document.activeElement.blur();}
  e.preventDefault();
  if(e.repeat)return;
  press(e.code);
});
addEventListener("keyup",e=>{
  const g=document.querySelector(`.guide .g[data-code="${e.code}"]`);
  if(g)g.classList.remove("on");
});
addEventListener("blur",()=>document.querySelectorAll(".guide .g.on").forEach(g=>g.classList.remove("on")));
$("giveup").addEventListener("click",()=>newPackage("포기했어요. 새 상자예요"));
$("next").addEventListener("click",()=>newPackage());

(function loop(){
  if(started&&!done){elapsed=(performance.now()-t0)/1000;$("time").textContent=elapsed.toFixed(1)+"초";}
  requestAnimationFrame(loop);
})();
newPackage();
})();
</script>
</body>
</html>
