<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확정 층수 택배 · 송장 붙이기 프로토타입</title>
<style>
:root{
  --cream:#f6ebd8;
  --paper:#fffaf0;
  --ink:#1f1a14;
  --blue:#7bbcf2;
  --blue-deep:#4f9be0;
  --blue-wash:#dff0ff;
  --frame:#2b2b2b;
  --dim:#a99f8e;
  --p1:#e0702a;
  --p2:#2a7fe0;
  --bad:#d6453d;
  --good:#2f9e5a;
  --font:"Oswald","Bebas Neue","Arial Narrow","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-weight:800;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px;user-select:none}
.hud{width:100%;max-width:1120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hud .score{font-size:22px}
.hud .score.p2{text-align:right}
.hud .score b{font-size:34px}
.p1c{color:var(--p1)} .p2c{color:var(--p2)}
.timer{font-size:44px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 22px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.stage{width:100%;max-width:1120px;display:grid;grid-template-columns:1fr 260px 1fr;gap:18px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px}
.pname{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.pname small{font-size:14px;color:var(--dim);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.floor{position:relative;height:66px;background:var(--paper);border:2.5px solid var(--blue);border-bottom-width:5px;border-radius:10px;font:inherit;font-size:28px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.floor.cursor{background:var(--blue-wash);border-color:var(--blue-deep);transform:translateY(-3px);box-shadow:0 0 0 3px var(--ink)}
.floor.picked{background:var(--blue-wash);border-color:var(--blue-deep);box-shadow:0 0 0 3px var(--ink)}
.floor.done{background:transparent;border:2px dashed #b9d8f2;color:var(--dim)}
.floor .tag{position:absolute;bottom:3px;right:6px;font-size:12px;font-weight:800;letter-spacing:.02em}
.floor .rival{position:absolute;top:3px;left:6px;font-size:11px;font-weight:700;color:var(--ink);background:#ffe27a;border-radius:6px;padding:0 5px}
.lane{position:relative;height:132px;border-radius:12px;background:linear-gradient(#9fd0f7,#7bbcf2);border:3px solid var(--frame);overflow:hidden}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:16px;transform:translateY(-50%);background:rgba(255,255,255,.28)}
.lane.idle{background:#e9dfcc;border-style:dashed;border-color:#c9bda6}
.lane.idle::before{display:none}
.zone{position:absolute;top:10px;bottom:10px;border:3px dashed var(--frame);border-radius:8px;background:rgba(255,255,255,.18);transform:translateX(-50%)}
.zone::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--frame);opacity:.35;transform:translateX(-50%)}
.invoice{position:absolute;top:50%;width:76px;height:58px;transform:translate(-50%,-50%);background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between}
.invoice .fl{font-size:20px;line-height:1}
.invoice .bar{height:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,#fff 2px 4px,var(--ink) 4px 5px,#fff 5px 8px)}
.invoice.crooked{transform:translate(-50%,-50%) rotate(14deg);border-color:var(--bad)}
.invoice.stuck{border-color:var(--good)}
.msg{min-height:22px;font-size:16px;font-weight:700;color:#5d5444}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.keys{font-size:13px;color:var(--dim);font-weight:700}
.card{background:var(--frame);border-radius:16px;padding:7px;box-shadow:0 5px 0 #151515}
.card .art{position:relative;border-radius:10px;background:linear-gradient(#6fb6f2,#4f9be0);height:230px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card .art::before{content:"";position:absolute;inset:-20px;background:linear-gradient(115deg,transparent 0 44%,rgba(255,255,255,.22) 44% 56%,transparent 56%);}
.chip{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 10px;font-size:17px;display:flex;align-items:center;gap:6px}
.chip.sub{font-size:13px;border-radius:12px;border-width:1.5px}
.dots{position:relative;display:flex;gap:4px;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:3px 6px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--blue-deep);border:1.5px solid var(--ink)}
.dots i.off{background:#fff;border:1.5px dashed #9ab}
.left{position:relative;font-size:15px}
.left b{font-size:20px}
.overlay{position:fixed;inset:0;background:rgba(246,235,216,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h1{margin:0;font-size:44px}
.overlay p{margin:0;font-size:20px;max-width:520px;line-height:1.5;font-weight:700}
.overlay .big{font-size:36px}
.overlay .btn{margin-top:6px;background:var(--paper);border:3px solid var(--blue);border-bottom-width:6px;border-radius:12px;padding:10px 26px;font-size:24px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.floor.cursor{transform:none}}
@media (max-width:900px){.stage{grid-template-columns:1fr}.card{order:-1}.card .art{height:150px}}
</style>
</head>
<body>

<div class="hud">
  <div class="score p1c">P1 <b id="s0">0</b>층 확정</div>
  <div class="timer" id="timer">1:30</div>
  <div class="score p2 p2c">P2 <b id="s1">0</b>층 확정</div>
</div>

<div class="stage">
  <section class="panel" id="panel0"></section>

  <aside class="card">
    <div class="art">
      <div class="chip"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1f1a14" stroke-width="1.6"><rect x="2" y="1.5" width="7" height="13"/><path d="M11 9l2 2 3-4"/></svg>확정 층수 택배</div>
      <div class="chip sub">송장 붙이기</div>
      <div class="dots" id="dots"></div>
      <div class="left">남은 <b id="remain">6</b> / 6</div>
    </div>
  </aside>

  <section class="panel" id="panel1"></section>
</div>

<div class="overlay" id="overlay">
  <h1>확정 층수 택배</h1>
  <p>6개 층 중 하나를 골라 송장을 붙이세요. 같은 층을 노려도 되지만, 먼저 붙인 사람이 그 층을 가져갑니다.</p>
  <p><span class="p1c">P1</span> 이동 A · D, 선택/부착 Space<br><span class="p2c">P2</span> 이동 ← · →, 선택/부착 Enter</p>
  <div class="btn">Space 또는 Enter로 시작</div>
</div>

<script>
(()=>{
"use strict";
/* ===== 조정용 설정 ===== */
const CFG={
  SESSION_SEC:90,   // 세션 제한 시간(초)
  MOVE_SPEED:46,    // 송장 이동 속도(레인 폭 %/초)
  LOCK_MS:1200,     // 실패 후 잠금 시간
  TOL_START:14, TOL_END:6,     // 허용 오차(%): 처음 → 마지막 층
  DRIFT_START:6, DRIFT_END:20  // 송장이 저절로 밀리는 속도(%/초)
};
const FLOORS=["B1","1F","2F","3F","4F","5F"];
const KEYS=[
  {left:"KeyA",right:"KeyD",act:"Space"},
  {left:"ArrowLeft",right:"ArrowRight",act:"Enter"}
];
const HINT=["이동 A · D / 선택·부착 Space","이동 ← · → / 선택·부착 Enter"];

let mode="ready", timeLeft=CFG.SESSION_SEC, owners, players, last=0, overAt=0;

/* ===== DOM ===== */
const $=id=>document.getElementById(id);
const ui=[0,1].map(i=>{
  const p=$("panel"+i);
  p.innerHTML=`
    <div class="pname"><span class="${i?"p2c":"p1c"}">P${i+1}</span><small>${HINT[i]}</small></div>
    <div class="grid">${FLOORS.map((f,k)=>`<div class="floor" data-k="${k}">${f}</div>`).join("")}</div>
    <div class="lane idle"></div>
    <div class="msg"></div>`;
  return {
    floors:[...p.querySelectorAll(".floor")],
    lane:p.querySelector(".lane"),
    msg:p.querySelector(".msg"),
    root:p
  };
});
$("dots").innerHTML=FLOORS.map(()=>"<i></i>").join("");
const dotEls=[...$("dots").children];

/* ===== 유틸 ===== */
let ac;
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const claimed=()=>owners.filter(o=>o!==null).length;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=()=>claimed()/(FLOORS.length-1);
const tolNow=()=>lerp(CFG.TOL_START,CFG.TOL_END,Math.min(1,prog()));
const driftNow=()=>lerp(CFG.DRIFT_START,CFG.DRIFT_END,Math.min(1,prog()));
function nearestOpen(from){
  for(let d=0;d<FLOORS.length;d++){
    for(const k of [from+d,from-d]){ if(k>=0&&k<FLOORS.length&&owners[k]===null) return k; }
  }
  return from;
}
function step(cursor,dir){
  for(let k=cursor+dir;k>=0&&k<FLOORS.length;k+=dir){ if(owners[k]===null) return k; }
  return cursor;
}
function say(i,text,cls){ui[i].msg.textContent=text;ui[i].msg.className="msg "+(cls||"");}

/* ===== 게임 흐름 ===== */
function newPlayer(i){
  return {i,phase:"select",cursor:nearestOpen(0),floor:null,x:50,target:50,tol:14,drift:0,flip:0,lockUntil:0,hits:0,miss:0,held:{l:false,r:false},stuckUntil:0};
}
function start(){
  owners=FLOORS.map(()=>null);
  players=[newPlayer(0),newPlayer(1)];
  timeLeft=CFG.SESSION_SEC;
  mode="play";
  $("overlay").classList.add("hide");
  players.forEach(p=>say(p.i,"층을 고르고 선택하세요"));
  beep(660,.12);
}
function beginAttach(p){
  p.phase="attach"; p.floor=p.cursor;
  p.tol=tolNow();
  p.target=22+Math.random()*56;
  do{p.x=8+Math.random()*84;}while(Math.abs(p.x-p.target)<p.tol+14);
  p.drift=(Math.random()<.5?-1:1)*driftNow();
  p.flip=.6+Math.random()*1.2;
  say(p.i,`${FLOORS[p.floor]} 송장을 점선 안에 맞추고 붙이세요`);
  beep(520,.08);
}
function attempt(p){
  const hit=Math.abs(p.x-p.target)<=p.tol;
  if(hit){
    p.hits++; owners[p.floor]=p.i; p.phase="stuck"; p.stuckUntil=performance.now()+650;
    say(p.i,`${FLOORS[p.floor]} 확정!`,"good"); beep(880,.15);
    players.forEach(q=>{
      if(q!==p && q.phase==="attach" && q.floor===p.floor){
        q.phase="select"; q.cursor=nearestOpen(q.cursor);
        say(q.i,`${FLOORS[p.floor]}은 상대가 먼저 확정했어요. 다른 층을 고르세요`,"bad"); beep(240,.15);
      }
    });
    players.forEach(q=>{ if(q.phase==="select") q.cursor=nearestOpen(q.cursor); });
    if(claimed()===FLOORS.length) finish();
  }else{
    p.miss++; p.lockUntil=performance.now()+CFG.LOCK_MS;
    say(p.i,"삐뚤어졌어요. 다시 맞추세요","bad"); beep(200,.2);
    ui[p.i].lane.classList.remove("shake"); void ui[p.i].lane.offsetWidth; ui[p.i].lane.classList.add("shake");
  }
}
function finish(){
  mode="over"; overAt=performance.now();
  const s=players.map(p=>owners.filter(o=>o===p.i).length);
  const acc=players.map(p=>p.hits+p.miss?Math.round(100*p.hits/(p.hits+p.miss)):0);
  let title;
  if(s[0]!==s[1]) title=`<span class="${s[0]>s[1]?"p1c":"p2c"}">P${s[0]>s[1]?1:2}</span> 승리`;
  else if(acc[0]!==acc[1]) title=`동점 · 정확도로 <span class="${acc[0]>acc[1]?"p1c":"p2c"}">P${acc[0]>acc[1]?1:2}</span> 승리`;
  else title="완전 무승부";
  const o=$("overlay");
  o.innerHTML=`<h1 class="big">${title}</h1>
    <p><span class="p1c">P1</span> ${s[0]}층 · 정확도 ${acc[0]}%<br><span class="p2c">P2</span> ${s[1]}층 · 정확도 ${acc[1]}%</p>
    <div class="btn">Space 또는 Enter로 다시 시작</div>`;
  o.classList.remove("hide");
}

/* ===== 입력 ===== */
addEventListener("keydown",e=>{
  const all=KEYS.flatMap(k=>[k.left,k.right,k.act]);
  if(all.includes(e.code)||e.code==="KeyR") e.preventDefault();
  if(mode==="ready"){ if(e.code==="Space"||e.code==="Enter") start(); return; }
  if(mode==="over"){ if((e.code==="Space"||e.code==="Enter"||e.code==="KeyR")&&performance.now()-overAt>800){ start(); } return; }
  KEYS.forEach((k,i)=>{
    const p=players[i], now=performance.now();
    if(p.phase==="stuck"||now<p.lockUntil) { if(e.code===k.left) p.held.l=true; if(e.code===k.right) p.held.r=true; return; }
    if(e.code===k.left){ p.held.l=true; if(p.phase==="select"&&!e.repeat){p.cursor=step(p.cursor,-1);beep(400,.03);} }
    if(e.code===k.right){ p.held.r=true; if(p.phase==="select"&&!e.repeat){p.cursor=step(p.cursor,1);beep(400,.03);} }
    if(e.code===k.act&&!e.repeat){
      if(p.phase==="select") beginAttach(p);
      else if(p.phase==="attach") attempt(p);
    }
  });
});
addEventListener("keyup",e=>{
  if(!players) return;
  KEYS.forEach((k,i)=>{
    if(e.code===k.left) players[i].held.l=false;
    if(e.code===k.right) players[i].held.r=false;
  });
});
addEventListener("blur",()=>{ if(players) players.forEach(p=>{p.held.l=p.held.r=false;}); });

/* ===== 갱신/렌더 ===== */
function update(dt){
  const now=performance.now();
  timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; finish(); return; }
  players.forEach(p=>{
    if(p.phase==="stuck"&&now>p.stuckUntil){ p.phase="select"; p.cursor=nearestOpen(p.cursor); if(mode==="play") say(p.i,"다음 층을 고르세요"); }
    if(p.phase==="attach"&&now>=p.lockUntil){
      const dir=(p.held.r?1:0)-(p.held.l?1:0);
      p.flip-=dt; if(p.flip<=0){ p.drift*=-1; p.flip=.6+Math.random()*1.2; }
      p.x+=(dir*CFG.MOVE_SPEED+p.drift)*dt;
      if(p.x<6){p.x=6;p.drift=Math.abs(p.drift);}
      if(p.x>94){p.x=94;p.drift=-Math.abs(p.drift);}
    }
  });
}
function render(){
  const rem=FLOORS.length-claimed();
  $("remain").textContent=rem;
  dotEls.forEach((d,k)=>d.className=k<rem?"":"off");
  $("s0").textContent=owners.filter(o=>o===0).length;
  $("s1").textContent=owners.filter(o=>o===1).length;
  const t=Math.ceil(timeLeft);
  $("timer").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  $("timer").classList.toggle("low",t<=10);
  const now=performance.now();
  players.forEach((p,i)=>{
    const u=ui[i], other=players[1-i];
    u.floors.forEach((el,k)=>{
      const done=owners[k]!==null;
      el.className="floor"+(done?" done":(p.phase==="select"&&p.cursor===k?" cursor":(p.phase==="attach"&&p.floor===k?" picked":"")));
      el.innerHTML=FLOORS[k]+(done?`<span class="tag ${owners[k]?"p2c":"p1c"}">P${owners[k]+1}</span>`:"")+
        (!done&&other.phase==="attach"&&other.floor===k?`<span class="rival">상대 진행</span>`:"");
    });
    if(p.phase==="attach"||p.phase==="stuck"){
      u.lane.classList.remove("idle");
      const stuck=p.phase==="stuck", locked=now<p.lockUntil;
      u.lane.innerHTML=`<div class="zone" style="left:${p.target}%;width:${p.tol*2}%"></div>
        <div class="invoice${stuck?" stuck":""}${locked?" crooked":""}" style="left:${stuck?p.target:p.x}%"><span class="fl">${FLOORS[p.floor]}</span><span class="bar"></span></div>`;
    }else{
      u.lane.classList.add("idle"); u.lane.innerHTML="";
    }
  });
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  if(mode==="play") update(dt);
  if(players) render();
  requestAnimationFrame(loop);
}
owners=FLOORS.map(()=>null); players=[newPlayer(0),newPlayer(1)];
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
